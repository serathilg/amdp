# _self_ composes first so the experiment_overrides group (a "@package _global_"
# group) can override the hyperparameters below at Hydra-composition time.
defaults:
  - _self_
  - env: mjx_dmc
  - experiment_overrides: default

hyperparameters:
  # env and run settings (mostly don't touch)
  total_time_steps: 80_000_000  #  total environment interactions
  normalize_env: true
  max_episode_steps: 1000  #  Environment episode length
  num_eval: 600  # Total number of evaluations total_time_steps / num_eval
  eval_first_episode_only: True # just take first episode of each env to avoid bias
  use_staggered_resets: false  # true: deterministic group stagger of initial elapsed steps (torch); false: random per-env offsets (original JAX)
  num_stagger_blocks: null  # optional group count; defaults to max_episode_steps // num_steps

  # optimization settings (seem very stable)
  lr: 3e-4  # Learning rate for actor AND critic
  anneal_lr: false
  max_grad_norm: 0.5
  polyak: 1.0 # maybe ablate ?
  use_target_critic_for_actor: False

  # problem discount settings (need tuning)
  gamma: 0.99  # discount factor
  lmbda: 0.95  # Parameter for TD lambda

  # batch settings (need tuning for MJX humanoid)
  # buffer_size  = num_steps * num_envs
  # batch_size = num_steps * num_envs / num_minibatches
  num_steps: 128
  num_mini_batches: 128
  num_envs: 1024
  num_subproc: 1
  num_epochs: 4

  batch_repetitions: 1

  Q_score_max_norm: 5.
  Q_score_max_percentile: 95.0
  Q_score_max_norm_for_squashed: False

  # This is only relevant when splitting learning actor and critic
  num_epochs_actor: 4
  num_epochs_critic: 4

  # exploration settings (currently not touched)
  exploration_noise_max: 1.0
  exploration_noise_min: 1.0
  exploration_base_envs: 0

  # critic architecture settings (need to be increased for MJX humanoid)
  critic_hidden_dim: 512
  vmin: ${env.vmin}
  vmax: ${env.vmax}
  num_bins: 151
  hl_gauss: true
  use_critic_norm: true
  num_critic_encoder_layers: 2
  num_critic_head_layers: 2
  num_critic_pred_layers: 2
  use_simplical_embedding: False
  use_critic_skip: False

  # actor & critic loss settings (seem remarkably stable)
  ## kl settings
  kl_start: 10.0  # initial value for  beta
  kl_bound: 0.1 # switched to tighter bounds for MJX
  reduce_kl: true
  update_kl_lagrangian: true
  ## entropy settings
  ent_start: 0.01
  ent_target_mult: 1.0
  update_entropy_lagrangian: true
  ## auxiliary loss settings
  aux_loss_mult: 1.0

  trust_region_lagrangian: "dual_optimal_geometric_average" # #reciprocal_dual_tr_entr", "dual_descent", "optimal_geometric_average", "projection", "dual_optimal_geometric_average"
  trust_region_time_weighting: True # consider time-dependent projection metric weighting, only for "optimal_geometric_average", "projection"
  trust_region_granularity: "avg" # "avg", "state"


  # logging settings (disable for faster training)
  log_pnorm: true  # log parameter norms (disable to save computation)
  log_gnorm: true  # log gradient norms (disable to save computation)

  # Diffusion settings
  diffusion:
    diff_steps: 16
    squashing: erf  # action squashing bijector: erf | tanh

    ou_settings:
      loss_scaling_exp_factor_power: 0
    score_model:
      residual: false
      num_layers: 4
      num_hid: 256
      time_mode: mlp # mlp, linear
      time_mlp_input: both # linear, fourier, both
      num_time_fourier: 16
      time_fourier_range_min: 0.1
      time_fourier_range_max: 100.0
      num_time_hid: 32
      num_time_out: 16
      action_mode: linear # mlp, linear
      action_mlp_input: both # linear, fourier, both
      num_action_fourier: 16
      action_fourier_range_min: 0.1
      action_fourier_range_max: 100.0
      num_action_hid: 32
      num_action_out: 16
      outer_clip: 1e4
      inner_clip: 1e2
      weight_init: 1e-8
      bias_init: 0.
      layer_norm: false # residual always uses norm
      layer_norm_type: "LayerNorm"
      res_stream_dim: 128 # residual stream width
      num_res_blocks: 4 # number of up+down residual blocks
      res_block_activation: "gelu" # 4x expand for "gelu", 8/3 for "gated_gelu"
      res_condition_mode: "concat" # "concat" or "adaln", concat adds obs+time to action input
      res_adaln_context_dim: 256 # dim for obs+time hidden/features of adaLN

    noise_schedule:
      _target_: src.networks.amdp.jax_scheduler.get_geometric_scheduler
      sigma_max: 2.
      sigma_min: 0.01

    # get methods
    sde_integrator: src.networks.amdp.jax_integrators_ou.sde_integrator
    ode_integrator: src.networks.amdp.jax_integrators_ou.ode_integrator

  # Deterministic (probability-flow ODE) evaluation, logged as eval/*_ode.
  eval_ode: false

name: "amdp_ou_reppo"
seed: 0
num_seeds: 1

num_trials: 1
tags: ["experimental", "fixed"]
wandb:
  mode: "offline" # set to online to activate wandb
  entity: null # null: WANDB_ENTITY or your default wandb entity
  project: "amdp_reppo"
  group: null

hydra:
  job:
    chdir: True
