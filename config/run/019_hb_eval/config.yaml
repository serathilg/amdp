# @package _global_
defaults:
  - default # need to set +run=.../config.yaml for correct resolve
  - override /env: humanoid_bench
  - override /experiment_overrides: humanoid_bench
  - _self_

idx: 019
exp_name: hb_eval

hydra:
  run:
    dir: outputs/019_hb_eval/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  mode: online
  project: amdp_reppo_hb
  group: 019_hb_eval

hyperparameters:
  diffusion:
    diff_steps: 16
    noise_schedule:
      sigma_max: 2.0
      sigma_min: 0.01
    score_model:
      num_layers: 3
      num_hid: 512
      layer_norm: true
  ent_start: 0.01
  kl_start: 1.0
  ent_target_mult: 1.0
  num_epochs_actor: 4
  polyak: 1.0
  aux_loss_mult: 1.0

  Q_score_max_percentile: 80.0

  total_time_steps: 52_428_800
  num_eval: 40

experiment_overrides:
  hyperparameters:
    lr: 3e-4
