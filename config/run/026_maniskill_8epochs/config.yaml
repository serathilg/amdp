# @package _global_
defaults:
  - default # need to set +run=.../config.yaml for correct resolve
  - override /env: maniskill
  - override /experiment_overrides: maniskill
  - _self_

idx: 026
exp_name: maniskill_8epochs

hydra:
  run:
    dir: outputs/026_maniskill_8epochs/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  mode: offline
  project: amdp_reppo_msk
  group: 026_maniskill_8epochs

hyperparameters:
  diffusion:
    diff_steps: 16
    noise_schedule:
      sigma_max: 2.0
      sigma_min: 0.01
    score_model:
      num_layers: 3
      num_hid: 512
      layer_norm: true
  ent_start: 0.01
  kl_start: 1.0
  ent_target_mult: 1.0
  num_epochs_actor: 8
  num_epochs_critic: 8
  num_mini_batches: 64
  polyak: 1.0
  aux_loss_mult: 1.0

  Q_score_max_percentile: 80.0

  total_time_steps: 52_428_800
  num_eval: 20
  best_of_n_values: [16.0]

experiment_overrides:
  hyperparameters:
    lr: 3e-4
