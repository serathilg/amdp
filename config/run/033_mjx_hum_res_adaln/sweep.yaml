entry_point: src/jaxrl/amdp_reppo.py
base_override: -cn amdp_reppo +run=033_mjx_hum_res_adaln/config
job_name: reppo_sweep
array: '0-15%0'
time: '480'
jobs_per_task: 4
grid:
  hyperparameters.diffusion.score_model.res_stream_dim:
  - '128'
  - '256'
  hyperparameters.diffusion.score_model.res_block_activation:
  - 'gelu'
  - 'gated_gelu'
list:
  env.name:
  - 'G1JoystickFlatTerrain'
  - 'G1JoystickRoughTerrain'
  - 'T1JoystickFlatTerrain'
  - 'T1JoystickRoughTerrain'
ablations:
- 'seed=1'
- 'seed=2'
- 'seed=3'
