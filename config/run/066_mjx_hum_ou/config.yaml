# @package _global_
defaults:
  - default # need to set +run=.../config.yaml for correct resolve
  - override /env: mjx_humanoid
  - _self_

idx: 066
exp_name: mjx_hum_ou

hydra:
  run:
    dir: outputs/066_mjx_hum_ou/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  mode: online
  project: amdp_ou_reppo_dmc
  group: 066_mjx_hum_ou

hyperparameters:
  diffusion:
    diff_steps: 16
    noise_schedule:
      sigma_max: 5.0
      sigma_min: 0.01
    score_model:
      num_layers: 3
      num_hid: 512
      layer_norm: true
    ou_settings:
      loss_scaling_exp_factor_power: 0
  update_entropy_lagrangian: true
  update_kl_lagrangian: true
  ent_start: 0.01
  kl_start: 1.0
  ent_target_mult: 1.0
  num_epochs_actor: 4
  polyak: 1.0
  use_target_critic_for_actor: False
  aux_loss_mult: 1.0

  Q_score_max_percentile: 80.0

  batch_repetitions: 1
  trust_region_lagrangian: dual_optimal_geometric_average
  trust_region_granularity: avg
  trust_region_time_weighting: True
  total_time_steps: 55_050_240
  num_eval: 21
  eval_first_episode_only: True
  eval_ode: false

  gamma: 0.97

experiment_overrides:
  hyperparameters:
    lr: 3e-4
